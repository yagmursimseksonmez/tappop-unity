<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      @font-face { font-family: "Geist"; src: url("../assets/fonts/Geist-Medium.ttf") format("truetype"); font-weight: 500; }
      html, body { margin: 0; height: 100%; background: #FFFFFF; color: #0A0A0A; font-family: system-ui, -apple-system, sans-serif; }
      #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #unity-canvas { display: block; height: min(calc(100dvh - 64px), 960px); aspect-ratio: 9 / 16; width: auto; max-width: 100vw;
        border-radius: 28px; box-shadow: 0 0 0 1px #E6E6E6; background: #F2F2F2; outline: none; }
      #loader { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 14px; font-size: 13px; color: #8E8E8E; }
      #bar { width: 120px; height: 3px; border-radius: 3px; background: #F2F2F2; overflow: hidden; }
      #bar i { display: block; height: 100%; width: 0; background: #0A0A0A; transition: width .2s ease-out; }
      #back { position: fixed; z-index: 1; top: 24px; left: 28px; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 18px 0 14px;
        border-radius: 999px; background: #FFFFFF; box-shadow: 0 0 0 1px #E0E0E0; color: #0A0A0A; text-decoration: none;
        font: 500 14px/1 "Geist", system-ui, -apple-system, sans-serif; transition: background .15s, transform .25s cubic-bezier(.34, 1.56, .64, 1); }
      #back:hover { background: #F2F2F2; }
      #back:active { transform: scale(.94); }
      #back:focus-visible { outline: 2px solid #0A0A0A; outline-offset: 2px; }
      @media (max-width: 600px), (pointer: coarse) {
        #unity-canvas { width: 100vw; height: 100dvh; border-radius: 0; box-shadow: none; }
        #back { display: none; }
      }
    </style>
  </head>
  <body>
    <a id="back" href="../"><span aria-hidden="true">←</span> Style guide</a>
    <div id="stage">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loader"><div id="bar"><i></i></div>Loading</div>
    </div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      const bar = document.querySelector("#bar i");
      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      }, (progress) => { bar.style.width = 100 * progress + "%"; })
        .then(() => { document.querySelector("#loader").remove(); })
        .catch((message) => { document.querySelector("#loader").textContent = message; });
    </script>
  </body>
</html>
